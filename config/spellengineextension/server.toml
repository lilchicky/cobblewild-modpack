# Don't change this! Version used to track needed updates.
version = 0
# When set to true, changing the players orientation and/or position while casting spells is disabled. Spells have to be in the \"\" spell tag for this to be active. Those spells can also apply an amount of ticks where movement is locked after casting the spell has ended.
enable_movement_locking_spell_casting = true
movement_locking_prevents_player_position_changes = true
movement_locking_prevents_player_orientation_changes = true
enable_attack_range_attribute_integration = true
# Enables 'conditional spell containers' and (if the 'Merged Items' mod is installed) 'merged spell containers'.
enable_spell_container_extensions = true
# When enabled, only spells in the 'spellengineextension:can_be_in_use_item_spell_hotbar_slot' are placed in the use_item hotbar slot.
enable_spell_hotbar_use_key_restriction = true
# Spells should cost health. Set to `false` to remove health cost from all spells.
spell_cost_health_allowed = false
# Spells should cost mana. Set to `false` to remove mana cost from all spells.
spell_cost_mana_allowed = false
# Spells should cost stamina. Set to `false` to remove stamina cost from all spells.
spell_cost_stamina_allowed = false
# Spells should require and optionally remove status effects. This cost is different to the effect cost added by vanilla Spell Engine to maintain compatibility. Set to `false` to remove custom effect cost from all spells.
spell_cost_custom_effects_allowed = false
# Spells can be affected by the 'spellengineextension:generic.extra_launch_count' entity attribute
spell_launch_properties_extra_launch_count_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_launch_delay' entity attribute
spell_launch_properties_extra_launch_delay_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_velocity' entity attribute
spell_launch_properties_extra_velocity_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_ricochet' entity attribute
spell_projectile_perk_extra_ricochet_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_ricochet_range' entity attribute
spell_projectile_perk_extra_ricochet_range_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_bounce' entity attribute
spell_projectile_perk_extra_bounce_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_pierce' entity attribute
spell_projectile_perk_extra_pierce_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_chain_reaction_size' entity attribute
spell_projectile_perk_extra_chain_reaction_size_attribute_allowed = true
# Spells can be affected by the 'spellengineextension:generic.extra_chain_reaction_triggers' entity attribute
spell_projectile_perk_extra_chain_reaction_triggers_attribute_allowed = true